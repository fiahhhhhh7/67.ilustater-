<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>67drawsy 簡易繪圖</title>
  <style>
    /* 徹底關閉頁面滑動與選取（檔名輸入框除外） */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* 畫面範圍外框 */
    .app-frame {
      position: relative;
      width: 360px;
      height: 560px;
      max-width: 96vw;
      max-height: 95vh;
      background-color: #ffffff;
      border: 2px solid #222222;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      padding: 12px 18px 18px 18px;
      overflow: hidden; /* 確保選色環最遠不超過畫面範圍 */
    }

    /* 頂部檔名列（預設為 67ilustater .jpeg，可更改檔名） */
    .filename-bar {
      display: flex;
      justify-content: center;
      align-items: baseline;
      gap: 2px;
      margin-bottom: 10px;
      height: 30px;
      flex-shrink: 0;
      z-index: 6;
    }

    .filename-input {
      width: 146px;
      border: none;
      border-bottom: 2px solid #b5b5b5;
      background: transparent;
      font-size: 20px;
      font-weight: 700;
      color: #111111;
      text-align: center;
      padding: 1px 4px;
      outline: none;
      user-select: text;
      -webkit-user-select: text;
      touch-action: manipulation;
      font-family: inherit;
      transition: border-color 0.15s ease;
    }

    .filename-input:focus {
      border-bottom-color: #222222;
    }

    .filename-ext {
      font-size: 20px;
      font-weight: 700;
      color: #111111;
      letter-spacing: 0.2px;
      pointer-events: none;
    }

    /* 灰框畫布範圍 */
    .canvas-wrapper {
      position: relative;
      flex: 1;
      width: 100%;
      border: 2px solid #b5b5b5;
      border-radius: 26px;
      background-color: #ffffff;
      overflow: hidden;
      box-sizing: border-box;
      transition: border-color 0.08s linear, box-shadow 0.08s linear;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }

    /* Reset 滑桿區域（拖動到底放開清空畫布，越往右邊此物件與畫布越紅、畫布發抖越劇烈） */
    .reset-bar-wrap {
      margin-top: 10px;
      height: 34px;
      width: 100%;
      display: flex;
      align-items: center;
      flex-shrink: 0;
      z-index: 6;
    }

    .reset-track {
      position: relative;
      width: 100%;
      height: 32px;
      border-radius: 16px;
      background-color: #bdbdbd;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      padding: 3px;
      overflow: hidden;
      transition: background-color 0.16s ease, box-shadow 0.16s ease;
    }

    .reset-label {
      position: absolute;
      right: 16px;
      font-size: 16px;
      font-weight: 600;
      color: #6e6e6e;
      letter-spacing: 0.5px;
      pointer-events: none;
      user-select: none;
      transition: color 0.12s ease;
    }

    .reset-thumb {
      position: relative;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background-color: #ffffff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.22);
      cursor: grab;
      z-index: 2;
      flex-shrink: 0;
      touch-action: none;
      transition: transform 0.16s ease, background-color 0.12s ease;
    }

    .reset-thumb:active {
      cursor: grabbing;
    }

    /* 底部工具列 */
    .toolbar {
      position: relative;
      height: 104px;
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 12px;
      flex-shrink: 0;
    }

    /* 左側：撤銷 / 重做（最多十步） */
    .history-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      z-index: 5;
    }

    .history-btn {
      width: 36px;
      height: 30px;
      border: none;
      background: transparent;
      padding: 0;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 7px;
      color: #7c8085;
      transition: transform 0.1s ease, background-color 0.15s ease, color 0.15s ease, opacity 0.15s ease;
    }

    .history-btn:hover:not(:disabled) {
      background-color: rgba(0, 0, 0, 0.06);
      color: #222222;
    }

    .history-btn:active:not(:disabled) {
      transform: scale(0.88);
    }

    .history-btn:disabled {
      opacity: 0.3;
      cursor: default;
    }

    /* 右側通用圖示按鈕（儲存成 jpeg） */
    .tool-btn {
      width: 48px;
      height: 48px;
      border: none;
      background: transparent;
      padding: 0;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 10px;
      transition: transform 0.12s ease, background-color 0.15s ease;
      z-index: 5;
    }

    .tool-btn:active {
      transform: scale(0.9);
    }

    /* 中央色塊與選色環舞台 */
    .center-control {
      position: relative;
      width: 84px;
      height: 84px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 長按展開的灰色選色環 */
    .color-ring {
      position: absolute;
      width: 0px;
      height: 0px;
      border-radius: 50%;
      border: 2px solid #b5b5b5;
      box-sizing: border-box;
      pointer-events: none;
      opacity: 0;
      z-index: 10;
      transition: opacity 0.12s ease;
    }

    .color-ring.active {
      opacity: 1;
    }

    /* 環上跟著角度與距離移動的色點 */
    .ring-knob {
      position: absolute;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background-color: #FBAE53;
      border: 1.5px solid rgba(0, 0, 0, 0.15);
      transform: translate(-50%, -50%);
      pointer-events: none;
      opacity: 0;
      z-index: 11;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      transition: opacity 0.12s ease;
    }

    .ring-knob.active {
      opacity: 1;
    }

    /* 中央圓角方形色塊 / 橡皮擦主體 */
    .color-block {
      position: relative;
      width: 66px;
      height: 66px;
      cursor: grab;
      z-index: 6;
      user-select: none;
      transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .color-block:active {
      cursor: grabbing;
    }

    .color-block.color-mode {
      transform: scale(1.06);
    }

    .color-block-surface {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 14px;
      background-color: #FBAE53;
      overflow: hidden;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
      transition: background-color 0.12s ease, box-shadow 0.12s ease;
    }

    /* 橡皮擦模式：主方塊變為橡皮擦圖示 */
    .color-block.eraser-mode .color-block-surface {
      background-color: transparent;
      box-shadow: none;
      opacity: 1 !important;
      overflow: visible;
    }

    .main-eraser-svg {
      display: none;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .color-block.eraser-mode .main-eraser-svg {
      display: block;
    }

    .color-block.eraser-mode .brush-indicator-v,
    .color-block.eraser-mode .brush-indicator-h {
      display: none;
    }

    /* 右下角小指示方塊：筆刷模式顯示小橡皮擦；橡皮擦模式顯示小色塊 */
    .mode-corner-badge {
      position: absolute;
      right: -7px;
      bottom: -7px;
      width: 22px;
      height: 22px;
      border-radius: 5px;
      background-color: #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.18);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 8;
      overflow: hidden;
      transition: transform 0.12s ease, background-color 0.12s ease;
    }

    .mode-corner-badge:active {
      transform: scale(0.88);
    }

    .mini-eraser-svg {
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
    }

    .mini-color-swatch {
      width: 100%;
      height: 100%;
      border-radius: 5px;
      background-color: #FBAE53;
      display: none;
      pointer-events: none;
    }

    .color-block.eraser-mode .mini-eraser-svg {
      display: none;
    }

    .color-block.eraser-mode .mini-color-swatch {
      display: block;
    }

    /* 方塊內部的微弱十字截距視覺指示（反映筆刷大小與不透明度） */
    .brush-indicator-v {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 5px;
      transform: translateX(-50%);
      background-color: rgba(255, 255, 255, 0.42);
      pointer-events: none;
    }

    .brush-indicator-h {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 4px;
      transform: translateY(-50%);
      background-color: rgba(255, 255, 255, 0.42);
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="app-frame" id="appFrame">
    <!-- 頂部檔名列（預設為 67ilustater .jpeg，可更改檔名） -->
    <div class="filename-bar">
      <input
        type="text"
        id="filenameInput"
        class="filename-input"
        value="67ilustater"
        aria-label="檔案名稱"
        maxlength="40"
        spellcheck="false"
        autocomplete="off"
      />
      <span class="filename-ext">.jpeg</span>
    </div>

    <!-- 灰框畫布範圍 -->
    <div class="canvas-wrapper" id="canvasWrapper">
      <canvas id="drawCanvas"></canvas>
    </div>

    <!-- Reset 滑桿（拖動到底放開清空畫布，越往右邊此物件與畫布越紅、畫布發抖越劇烈） -->
    <div class="reset-bar-wrap">
      <div class="reset-track" id="resetTrack">
        <span class="reset-label" id="resetLabel">reset</span>
        <div class="reset-thumb" id="resetThumb" role="slider" aria-label="滑動到底放開清空畫布" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
      </div>
    </div>

    <!-- 底部工具區 -->
    <div class="toolbar">
      <!-- 左側：撤銷 / 重做（最多十步） -->
      <div class="history-stack">
        <button class="history-btn" id="undoBtn" aria-label="撤銷" title="撤銷（最多十步）" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M9 6L4 11L9 16" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M5 11H14.5C17.5376 11 20 13.4624 20 16.5C20 18.4853 18.9477 20.2255 17.3666 21.1924" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="history-btn" id="redoBtn" aria-label="重做" title="重做（最多十步）" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M15 6L20 11L15 16" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M19 11H9.5C6.46243 11 4 13.4624 4 16.5C4 18.4853 5.05228 20.2255 6.63339 21.1924" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <!-- 中央：多功能色塊（長按選色 / 直接上下不透明度 / 直接左右筆刷大小 / 雙擊切換橡皮擦並顯示橡皮擦圖示） -->
      <div class="center-control" id="centerControl">
        <div class="color-ring" id="ring"></div>
        <div class="ring-knob" id="knob"></div>
        <div class="color-block" id="colorBlock">
          <div class="color-block-surface" id="colorBlockSurface">
            <div class="brush-indicator-v" id="sizeBar"></div>
            <div class="brush-indicator-h" id="opacityBar"></div>
            <svg class="main-eraser-svg" viewBox="0 0 66 66" fill="none" aria-hidden="true">
              
  <rect x="4" y="4" width="58" height="58" rx="13" fill="#ffffff" stroke="#181818" stroke-width="3.2"/>
  <!-- 藍-灰-藍膠套下半部 -->
  <path d="M5.6 24 H60.4 V58.5 C60.4 59.6 59.5 60.4 58.4 60.4 H7.6 C6.5 60.4 5.6 59.6 5.6 58.5 Z" fill="#2f66b8"/>
  <!-- 中間灰白條帶 -->
  <rect x="21.5" y="24" width="23" height="36.4" fill="#d0d3d7"/>
  <!-- 斜向陰影分界（左上往右下斜切） -->
  <polygon points="5.6,24 60.4,57.5 60.4,60.4 5.6,27.2" fill="rgba(15, 32, 65, 0.18)"/>
  <polygon points="21.5,24 44.5,38.2 44.5,60.4 21.5,46.2" fill="#ffffff" opacity="0.88"/>
  <!-- 膠套頂部橫線與外框 -->
  <line x1="5.6" y1="24" x2="60.4" y2="24" stroke="#181818" stroke-width="2.2"/>
  <rect x="4" y="4" width="58" height="58" rx="13" fill="none" stroke="#181818" stroke-width="3.2"/>

            </svg>
          </div>
          <div class="mode-corner-badge" id="modeCornerBadge" title="切換筆刷 / 橡皮擦模式" aria-label="切換筆刷與橡皮擦">
            <svg class="mini-eraser-svg" viewBox="0 0 66 66" fill="none" aria-hidden="true">
              
  <rect x="4" y="4" width="58" height="58" rx="13" fill="#ffffff" stroke="#181818" stroke-width="3.2"/>
  <!-- 藍-灰-藍膠套下半部 -->
  <path d="M5.6 24 H60.4 V58.5 C60.4 59.6 59.5 60.4 58.4 60.4 H7.6 C6.5 60.4 5.6 59.6 5.6 58.5 Z" fill="#2f66b8"/>
  <!-- 中間灰白條帶 -->
  <rect x="21.5" y="24" width="23" height="36.4" fill="#d0d3d7"/>
  <!-- 斜向陰影分界（左上往右下斜切） -->
  <polygon points="5.6,24 60.4,57.5 60.4,60.4 5.6,27.2" fill="rgba(15, 32, 65, 0.18)"/>
  <polygon points="21.5,24 44.5,38.2 44.5,60.4 21.5,46.2" fill="#ffffff" opacity="0.88"/>
  <!-- 膠套頂部橫線與外框 -->
  <line x1="5.6" y1="24" x2="60.4" y2="24" stroke="#181818" stroke-width="2.2"/>
  <rect x="4" y="4" width="58" height="58" rx="13" fill="none" stroke="#181818" stroke-width="3.2"/>

            </svg>
            <div class="mini-color-swatch" id="miniColorSwatch"></div>
          </div>
        </div>
      </div>

      <!-- 右側：儲存成 jpeg -->
      <button class="tool-btn" id="saveBtn" aria-label="儲存成 jpeg">
        <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
          <path d="M6 8 C6 6.89543 6.89543 6 8 6 H25 L30 11 V28 C30 29.1046 29.1046 30 28 30 H8 C6.89543 30 6 29.1046 6 28 V8 Z" fill="#111111"/>
          <rect x="10" y="7.5" width="13" height="8" rx="1" fill="#ffffff"/>
          <rect x="18" y="9" width="3" height="5" fill="#111111"/>
          <rect x="10" y="19" width="16" height="9.5" rx="1" fill="#ffffff"/>
        </svg>
      </button>
    </div>
  </div>

  <script>
    const filenameInput = document.getElementById('filenameInput');

    // 禁止非輸入框的頁面預設觸控滑動
    document.addEventListener('touchmove', (e) => {
      if (document.activeElement === filenameInput && filenameInput.contains(e.target)) {
        return;
      }
      e.preventDefault();
    }, { passive: false });

    const appFrame = document.getElementById('appFrame');
    const canvasWrapper = document.getElementById('canvasWrapper');
    const canvas = document.getElementById('drawCanvas');
    const ctx = canvas.getContext('2d');

    const resetTrack = document.getElementById('resetTrack');
    const resetThumb = document.getElementById('resetThumb');
    const resetLabel = document.getElementById('resetLabel');

    const undoBtn = document.getElementById('undoBtn');
    const redoBtn = document.getElementById('redoBtn');
    const saveBtn = document.getElementById('saveBtn');
    const centerControl = document.getElementById('centerControl');
    const colorBlock = document.getElementById('colorBlock');
    const colorBlockSurface = document.getElementById('colorBlockSurface');
    const modeCornerBadge = document.getElementById('modeCornerBadge');
    const miniColorSwatch = document.getElementById('miniColorSwatch');
    const ring = document.getElementById('ring');
    const knob = document.getElementById('knob');
    const sizeBar = document.getElementById('sizeBar');
    const opacityBar = document.getElementById('opacityBar');

    // ================= 繪圖狀態設定 =================
    let currentColor = '#FBAE53'; // 預設 #FBAE53
    let currentHue = 32;
    let currentLightness = 65;
    let brushSize = 8;            // 筆刷大小 (px): 1 ~ 42
    let brushOpacity = 1.0;       // 筆刷不透明度: 0.05 ~ 1.0
    let isEraser = false;
    let isDrawing = false;
    let lastX = 0;
    let lastY = 0;

    // ================= 撤銷 / 重做歷史紀錄（最多十步） =================
    const MAX_UNDO_REDO_STEPS = 10;
    let undoStack = [];
    let redoStack = [];

    function updateHistoryButtons() {
      undoBtn.disabled = undoStack.length <= 1;
      redoBtn.disabled = redoStack.length === 0;
    }

    function saveSnapshot() {
      if (canvas.width === 0 || canvas.height === 0) return;
      const snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
      undoStack.push(snapshot);
      while (undoStack.length > MAX_UNDO_REDO_STEPS + 1) {
        undoStack.shift();
      }
      redoStack = [];
      updateHistoryButtons();
    }

    function performUndo() {
      if (undoStack.length <= 1) return;
      const currentState = undoStack.pop();
      redoStack.push(currentState);
      if (redoStack.length > MAX_UNDO_REDO_STEPS) {
        redoStack.shift();
      }
      const prevState = undoStack[undoStack.length - 1];
      ctx.putImageData(prevState, 0, 0);
      updateHistoryButtons();
    }

    function performRedo() {
      if (redoStack.length === 0) return;
      const nextState = redoStack.pop();
      undoStack.push(nextState);
      while (undoStack.length > MAX_UNDO_REDO_STEPS + 1) {
        undoStack.shift();
      }
      ctx.putImageData(nextState, 0, 0);
      updateHistoryButtons();
    }

    undoBtn.addEventListener('click', performUndo);
    redoBtn.addEventListener('click', performRedo);

    // 初始化高解析度畫布
    function initCanvas() {
      const rect = canvasWrapper.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.round(rect.width * dpr));
      canvas.height = Math.max(1, Math.round(rect.height * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, rect.width, rect.height);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      undoStack = [];
      redoStack = [];
      saveSnapshot();
    }
    initCanvas();

    function clearCanvasContent(recordHistory = true) {
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.restore();
      if (recordHistory) {
        saveSnapshot();
      }
    }

    // 更新色塊與右下角模式指示方塊外觀（符合筆刷模式 / 橡皮擦模式圖示）
    function syncBlockAppearance() {
      colorBlock.classList.toggle('eraser-mode', isEraser);
      miniColorSwatch.style.backgroundColor = currentColor;
      knob.style.backgroundColor = currentColor;

      if (isEraser) {
        colorBlockSurface.style.backgroundColor = 'transparent';
        colorBlockSurface.style.opacity = '1';
      } else {
        colorBlockSurface.style.backgroundColor = currentColor;
        colorBlockSurface.style.opacity = Math.max(0.18, brushOpacity);
      }

      const barWidth = Math.max(2, Math.min(48, brushSize));
      sizeBar.style.width = `${barWidth}px`;
      const topPercent = (1 - brushOpacity) * 80 + 10;
      opacityBar.style.top = `${topPercent}%`;
    }
    syncBlockAppearance();

    // ================= Reset 滑桿互動（拖動到底放開清空畫布 + 越右越紅 + 畫布發抖越劇烈） =================
    let isResetDragging = false;
    let resetStartX = 0;
    let resetProgress = 0;
    let shakeRafId = null;

    function getMaxResetTravel() {
      const trackRect = resetTrack.getBoundingClientRect();
      const thumbRect = resetThumb.getBoundingClientRect();
      const padding = 3;
      return Math.max(1, trackRect.width - thumbRect.width - padding * 2);
    }

    function applyRedAndShake(progress) {
      const p = Math.max(0, Math.min(1, progress));
      resetThumb.setAttribute('aria-valuenow', String(Math.round(p * 100)));

      if (p <= 0.001) {
        resetTrack.style.backgroundColor = '#bdbdbd';
        resetThumb.style.backgroundColor = '#ffffff';
        resetLabel.style.color = '#6e6e6e';
        canvasWrapper.style.borderColor = '#b5b5b5';
        canvasWrapper.style.boxShadow = 'none';
        canvasWrapper.style.backgroundColor = '#ffffff';
        canvas.style.opacity = '1';
        canvasWrapper.style.transform = 'translate(0px, 0px) rotate(0deg)';
        return;
      }

      const trackR = Math.round(189 + (224 - 189) * p);
      const trackG = Math.round(189 * (1 - p * 0.86));
      const trackB = Math.round(189 * (1 - p * 0.86));
      resetTrack.style.backgroundColor = `rgb(${trackR}, ${trackG}, ${trackB})`;

      const thumbR = 255;
      const thumbG = Math.round(255 * (1 - p * 0.65));
      const thumbB = Math.round(255 * (1 - p * 0.65));
      resetThumb.style.backgroundColor = `rgb(${thumbR}, ${thumbG}, ${thumbB})`;

      resetLabel.style.color = p > 0.45 ? '#ffffff' : `rgb(${Math.round(110 + 145 * p)}, ${Math.round(110 * (1 - p))}, ${Math.round(110 * (1 - p))})`;

      const borderG = Math.round(181 * (1 - p * 0.85));
      const borderB = Math.round(181 * (1 - p * 0.85));
      canvasWrapper.style.borderColor = `rgb(225, ${borderG}, ${borderB})`;
      canvasWrapper.style.boxShadow = `inset 0 0 ${Math.round(18 * p)}px rgba(235, 35, 35, ${(0.45 * p).toFixed(2)})`;
      canvasWrapper.style.backgroundColor = `rgba(255, 65, 65, ${(0.22 * p).toFixed(2)})`;
      canvas.style.opacity = String((1 - 0.14 * p).toFixed(3));
    }

    function shakeLoop() {
      if (!isResetDragging || resetProgress <= 0.005) {
        canvasWrapper.style.transform = 'translate(0px, 0px) rotate(0deg)';
        shakeRafId = null;
        return;
      }

      const intensity = Math.pow(resetProgress, 1.35);
      const maxOffset = 1.2 + intensity * 7.5;
      const maxAngle = intensity * 1.6;

      const dx = (Math.random() * 2 - 1) * maxOffset;
      const dy = (Math.random() * 2 - 1) * maxOffset;
      const rot = (Math.random() * 2 - 1) * maxAngle;

      canvasWrapper.style.transform = `translate(${dx.toFixed(2)}px, ${dy.toFixed(2)}px) rotate(${rot.toFixed(2)}deg)`;
      shakeRafId = requestAnimationFrame(shakeLoop);
    }

    function setResetSlidePosition(progress, animate = false) {
      const maxTravel = getMaxResetTravel();
      const clamped = Math.max(0, Math.min(1, progress));
      resetProgress = clamped;
      const offsetX = clamped * maxTravel;

      resetThumb.style.transition = animate
        ? 'transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.2s ease'
        : 'none';
      resetThumb.style.transform = `translateX(${offsetX.toFixed(1)}px)`;
      applyRedAndShake(clamped);
    }

    resetThumb.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      resetThumb.setPointerCapture(e.pointerId);
      isResetDragging = true;
      resetStartX = e.clientX - resetProgress * getMaxResetTravel();
      if (!shakeRafId) {
        shakeRafId = requestAnimationFrame(shakeLoop);
      }
    });

    resetThumb.addEventListener('pointermove', (e) => {
      if (!isResetDragging) return;
      e.preventDefault();
      const maxTravel = getMaxResetTravel();
      const deltaX = e.clientX - resetStartX;
      setResetSlidePosition(deltaX / maxTravel, false);
    });

    function finishResetDrag() {
      if (!isResetDragging) return;
      isResetDragging = false;
      if (shakeRafId) {
        cancelAnimationFrame(shakeRafId);
        shakeRafId = null;
      }

      if (resetProgress >= 0.92) {
        clearCanvasContent(true);
      }

      setResetSlidePosition(0, true);
      canvasWrapper.style.transform = 'translate(0px, 0px) rotate(0deg)';
    }

    resetThumb.addEventListener('pointerup', finishResetDrag);
    resetThumb.addEventListener('pointercancel', finishResetDrag);

    // ================= 畫布繪圖事件 =================
    function getCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
      };
    }

    canvas.addEventListener('pointerdown', (e) => {
      if (document.activeElement === filenameInput) {
        filenameInput.blur();
      }
      e.preventDefault();
      canvas.setPointerCapture(e.pointerId);
      isDrawing = true;
      const pos = getCanvasCoords(e);
      lastX = pos.x;
      lastY = pos.y;

      ctx.save();
      ctx.globalAlpha = isEraser ? 1.0 : brushOpacity;
      ctx.fillStyle = isEraser ? '#ffffff' : currentColor;
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, brushSize / 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!isDrawing) return;
      e.preventDefault();
      const pos = getCanvasCoords(e);

      ctx.save();
      ctx.globalAlpha = isEraser ? 1.0 : brushOpacity;
      ctx.strokeStyle = isEraser ? '#ffffff' : currentColor;
      ctx.lineWidth = brushSize;
      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
      ctx.restore();

      lastX = pos.x;
      lastY = pos.y;
    });

    function endDrawing() {
      if (!isDrawing) return;
      isDrawing = false;
      saveSnapshot();
    }
    canvas.addEventListener('pointerup', endDrawing);
    canvas.addEventListener('pointercancel', endDrawing);

    // ================= 右側：儲存成 <檔名>.jpeg =================
    function getExportFilename() {
      let raw = (filenameInput.value || '').trim();
      // 移除副檔名若使用者順手輸入了 .jpeg 或 .jpg
      raw = raw.replace(/\.(jpe?g)$/i, '').trim();
      // 移除不合法檔名字元
      raw = raw.replace(/[\/:*?"<>|]/g, '_');
      if (!raw) {
        raw = '67ilustater';
      }
      return `${raw}.jpeg`;
    }

    saveBtn.addEventListener('click', () => {
      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = canvas.width;
      exportCanvas.height = canvas.height;
      const eCtx = exportCanvas.getContext('2d');
      eCtx.fillStyle = '#ffffff';
      eCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);
      eCtx.drawImage(canvas, 0, 0);

      const dataUrl = exportCanvas.toDataURL('image/jpeg', 0.95);
      const link = document.createElement('a');
      link.download = getExportFilename();
      link.href = dataUrl;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });

    // ================= 中央色塊互動 =================
    // 1. 長按 0.5 秒 -> 震動提示 -> 選色環（角度=色相，距離=明度，中心=黑，最遠=白，不超過畫面範圍，點跟著角度、環隨距離擴大）
    // 2. 直接上下/左右拖動 -> 控制筆刷不透明度 / 筆刷大小
    // 3. 雙擊 -> 切換成橡皮擦，並在色塊位置放上橡皮擦圖示（再雙擊可切回畫筆）

    const LONG_PRESS_DURATION = 500;
    const MOVE_THRESHOLD = 6;
    const INTERCEPT_RANGE = 42;
    const DOUBLE_TAP_WINDOW = 320;

    let pressTimer = null;
    let interactionMode = 'idle'; // 'idle' | 'pending' | 'brush_adjust' | 'color_pick'
    let startPointerX = 0;
    let startPointerY = 0;
    let startBrushSize = brushSize;
    let startBrushOpacity = brushOpacity;
    let lastTapTime = 0;
    let movedDuringGesture = false;

    function getMaxAllowedRadius() {
      const frameRect = appFrame.getBoundingClientRect();
      const ctrlRect = centerControl.getBoundingClientRect();
      const centerX = ctrlRect.left + ctrlRect.width / 2;
      const centerY = ctrlRect.top + ctrlRect.height / 2;

      const distLeft = centerX - frameRect.left - 12;
      const distRight = frameRect.right - centerX - 12;
      const distTop = centerY - frameRect.top - 12;
      const distBottom = frameRect.bottom - centerY - 12;

      return Math.max(40, Math.min(distLeft, distRight, distTop, distBottom));
    }

    function hslToHex(h, s, l) {
      l /= 100;
      const a = s * Math.min(l, 1 - l) / 100;
      const f = n => {
        const k = (n + h / 30) % 12;
        const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
        return Math.round(255 * color).toString(16).padStart(2, '0');
      };
      return `#${f(0)}${f(8)}${f(4)}`.toUpperCase();
    }

    function enterColorPickMode(clientX, clientY) {
      interactionMode = 'color_pick';
      if (isEraser) {
        isEraser = false;
      }

      if (navigator.vibrate) {
        navigator.vibrate(40);
      }

      colorBlock.classList.add('color-mode');
      ring.classList.add('active');
      knob.classList.add('active');

      const initRadius = 46;
      const initAngle = -45 * (Math.PI / 180);
      updateColorRing(initRadius, initAngle, currentHue, currentLightness);

      if (clientX !== undefined && clientY !== undefined) {
        handleColorPickMove(clientX, clientY);
      }
    }

    function updateColorRing(radius, angleRad, hue, lightness) {
      const diameter = radius * 2;
      ring.style.width = `${diameter}px`;
      ring.style.height = `${diameter}px`;

      const cx = centerControl.clientWidth / 2;
      const cy = centerControl.clientHeight / 2;
      knob.style.left = `${cx + Math.cos(angleRad) * radius}px`;
      knob.style.top = `${cy + Math.sin(angleRad) * radius}px`;

      currentColor = hslToHex(hue, 100, lightness);
      syncBlockAppearance();
    }

    function handleColorPickMove(clientX, clientY) {
      const ctrlRect = centerControl.getBoundingClientRect();
      const cx = ctrlRect.left + ctrlRect.width / 2;
      const cy = ctrlRect.top + ctrlRect.height / 2;

      const dx = clientX - cx;
      const dy = clientY - cy;
      const maxR = getMaxAllowedRadius();

      const rawDist = Math.hypot(dx, dy);
      const clampedR = Math.min(rawDist, maxR);

      const ratio = Math.max(0, Math.min(1, rawDist / maxR));
      currentLightness = ratio * 100;

      const angleRad = Math.atan2(dy, dx);
      const angleDeg = angleRad * (180 / Math.PI);
      currentHue = (angleDeg + 360 + 77) % 360;

      updateColorRing(Math.max(8, clampedR), angleRad, currentHue, currentLightness);
    }

    function handleBrushAdjustMove(clientX, clientY) {
      const dx = clientX - startPointerX;
      const dy = clientY - startPointerY;

      const clampedDx = Math.max(-INTERCEPT_RANGE, Math.min(INTERCEPT_RANGE, dx));
      const sizeDelta = (clampedDx / INTERCEPT_RANGE) * 20;
      brushSize = Math.max(1, Math.min(42, startBrushSize + sizeDelta));

      const clampedDy = Math.max(-INTERCEPT_RANGE, Math.min(INTERCEPT_RANGE, dy));
      const opacityDelta = (-clampedDy / INTERCEPT_RANGE) * 0.5;
      brushOpacity = Math.max(0.05, Math.min(1.0, startBrushOpacity + opacityDelta));

      syncBlockAppearance();
    }

    colorBlock.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      colorBlock.setPointerCapture(e.pointerId);

      interactionMode = 'pending';
      movedDuringGesture = false;
      startPointerX = e.clientX;
      startPointerY = e.clientY;
      startBrushSize = brushSize;
      startBrushOpacity = brushOpacity;

      pressTimer = setTimeout(() => {
        if (interactionMode === 'pending') {
          enterColorPickMode(startPointerX, startPointerY);
        }
      }, LONG_PRESS_DURATION);
    });

    colorBlock.addEventListener('pointermove', (e) => {
      if (interactionMode === 'idle') return;
      e.preventDefault();

      if (interactionMode === 'pending') {
        const dist = Math.hypot(e.clientX - startPointerX, e.clientY - startPointerY);
        if (dist > MOVE_THRESHOLD) {
          movedDuringGesture = true;
          clearTimeout(pressTimer);
          interactionMode = 'brush_adjust';
          handleBrushAdjustMove(e.clientX, e.clientY);
        }
      } else if (interactionMode === 'brush_adjust') {
        handleBrushAdjustMove(e.clientX, e.clientY);
      } else if (interactionMode === 'color_pick') {
        handleColorPickMove(e.clientX, e.clientY);
      }
    });

    function handleBlockRelease(e) {
      const wasPending = interactionMode === 'pending';
      clearTimeout(pressTimer);
      interactionMode = 'idle';
      colorBlock.classList.remove('color-mode');
      ring.classList.remove('active');
      knob.classList.remove('active');

      // 短按未拖動且未進入長按選色環時，偵測雙擊切換橡皮擦
      if (wasPending && !movedDuringGesture && e.type === 'pointerup') {
        const now = Date.now();
        if (now - lastTapTime <= DOUBLE_TAP_WINDOW) {
          isEraser = !isEraser;
          syncBlockAppearance();
          lastTapTime = 0;
        } else {
          lastTapTime = now;
        }
      }
    }

    colorBlock.addEventListener('pointerup', handleBlockRelease);
    colorBlock.addEventListener('pointercancel', handleBlockRelease);

    modeCornerBadge.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      e.stopPropagation();
    });

    modeCornerBadge.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      isEraser = !isEraser;
      syncBlockAppearance();
    });

  </script>
</body>
</html>
